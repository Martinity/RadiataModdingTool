name: Release
# MAINTAINER-GATED: triggers only on v* tags. Confirm versioning/branching before tagging.
# For patch notes or version updates, write to .github/workflows/patch_notes.md
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       label: macos-arm64,  arch: arm64 }
          # - { os: macos-13,       label: macos-x86_64, arch: x86_64 }
          - { os: windows-latest, label: windows-x64,  arch: x64 }
          - { os: ubuntu-24.04,   label: linux-x86_64, arch: x86_64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Inject version from tag
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > core/_version.py
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build native libs
        run: python scripts/build_native.py
      - name: Build bundle
        run: pyinstaller radiata.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}"

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo wget -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          if ! echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /usr/local/bin/appimagetool" | sha256sum --check; then
            echo "ERROR: Checksum mismatch! Actual checksum: "
            sha256sum /usr/local/bin/appimagetool
            exit 1
          fi
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash scripts/package-linux.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/RadiataModdingTool.exe -DestinationPath "RadiataModdingTool-${{ github.ref_name }}-windows-x64.zip"

      - name: Generate SHA-256 Checksums (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: shasum -a 256 *.dmg 2>/dev/null > SHA256SUM-macos-${{ matrix.arch }}.txt || true
      - name: Generate SHA-256 Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath SHA256SUM-windows-x64.txt -Append
          }
      - name: Generate SHA-256 Checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum *.AppImage > SHA256SUM-linux-x86_64.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.label }}
          path: |
            *.AppImage
            *.dmg
            *.zip
            SHA256SUM-*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Prepare Release Body
        id: prep_notes
        shell: bash
        run: |
          NOTES_FILE=".github/workflows/patch_notes.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "NOTES<<EOF" >> $GITHUB_ENV
            cat "$NOTES_FILE" >> $GITHUB_ENV
            echo -e "\n\nFor further installation instructions and binary verification, please refer to the [README](https://github.com/${{ github.repository }}#installation)." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "NOTES=For further installation instructions and binary verification, please refer to the [README](https://github.com/${{ github.repository }}#installation)." >> $GITHUB_ENV
          fi

      - name: Publish to Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
          body: ${{ env.NOTES }}
